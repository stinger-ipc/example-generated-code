syntax = "proto3";

package signal_only;




// Advertisement/discovery information published periodically for the interface.
message InterfaceInfo {
    string interface_name = 1;
    string title = 2;
    string version = 3;
    string instance = 4;
    string connection_topic = 5;
    string timestamp = 6;  // ISO 8601 format
    map<string, string> methods = 7;  // Maps method names to their version string, for methods that declare a version.
}





message AnotherSignalSignal {
    float one = 1;
    bool two = 2;
    string three = 3;
}

message BarkSignal {
    string word = 1;
}

message MaybeNumberSignal {
    optional int32 number = 1;
}

message MaybeNameSignal {
    optional string name = 1;
}

message NowSignal {
    string timestamp = 1;  // ISO 8601 format
}




