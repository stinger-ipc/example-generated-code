    title: CurrentTemperaturePropertyValue
  current_time:
    address: '{prefix}/weather/{service_id}/signal/current_time'
    description: "Once in a while (at intervals decided by the provider) the current
      date\nand time will be published.  (Mostly for example purposes).\n"
