components:
  parameters:
    client_id:
      description: The MQTT Client ID
    prefix:
      description: Topic parameter 'prefix'
    service_id:
      description: The ID of the service/instance
  schemas:
    current_condition_property:
      properties:
        condition:
          $ref: '#/components/schemas/weather_condition'
        description:
          type: string
      required:
      - condition
      - description
      type: object
    current_condition_refresh_interval_property:
      properties:
        seconds:
          type: integer
      required:
      - seconds
      type: object
    current_temperature_property:
      properties:
        temperature_f:
          type: number
      required:
      - temperature_f
      type: object
    daily_forecast_property:
      properties:
        monday:
          $ref: '#/components/schemas/forecast_for_day'
        tuesday:
          $ref: '#/components/schemas/forecast_for_day'
        wednesday:
          $ref: '#/components/schemas/forecast_for_day'
      required:
      - monday
      - tuesday
      - wednesday
      type: object
    daily_forecast_refresh_interval_property:
      properties:
        seconds:
          type: integer
      required:
      - seconds
      type: object
    forecast_for_day:
      description: "This structure contains the forecast for a single day.  The high
        or low temperature\nmay be missing for the current day.\n"
      properties:
        condition:
          $ref: '#/components/schemas/weather_condition'
        end_time:
          type: string
        high_temperature:
          description: High temperature for the day in degrees fahrenheit.
          type: number
        low_temperature:
          description: Low temperature for the day in degrees fahrenheit.
          type: number
        start_time:
          type: string
      required:
      - high_temperature
      - low_temperature
      - condition
      - start_time
      - end_time
      type: object
    forecast_for_hour:
      description: "This structure contains the forecast for a single hour.\n"
      properties:
        condition:
          $ref: '#/components/schemas/weather_condition'
        starttime:
          description: Forecast is valid for the hour starting at this time.
          format: date-time
          type: string
        temperature:
          description: Forecasted temperature in degrees fahrenheit.
          type: number
      required:
      - temperature
      - starttime
      - condition
      type: object
    hourly_forecast_property:
      properties:
        hour_0:
          $ref: '#/components/schemas/forecast_for_hour'
        hour_1:
          $ref: '#/components/schemas/forecast_for_hour'
        hour_2:
          $ref: '#/components/schemas/forecast_for_hour'
        hour_3:
          $ref: '#/components/schemas/forecast_for_hour'
      required:
      - hour_0
      - hour_1
      - hour_2
      - hour_3
      type: object
    hourly_forecast_refresh_interval_property:
      properties:
        seconds:
          description: Interval duration in seconds.
          type: integer
      required:
      - seconds
      type: object
    location_property:
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
      - latitude
      - longitude
      type: object
    weather_condition:
      description: "This enum contains the possible weather conditions that can be
        reported.\n\nJSON Value `1` is `rainy` - \nJSON Value `2` is `sunny` - \n\
        JSON Value `3` is `partly_cloudy` - \nJSON Value `4` is `mostly_cloudy` -\
        \ \nJSON Value `5` is `overcast` - \nJSON Value `6` is `windy` - \nJSON Value
        `7` is `snowy` - "
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
info:
  description: Current conditions, daily and hourly forecasts from the NWS API
  tags:
  - name: signal
  - name: method
  - name: property
  - name: discovery
  title: weather
  version: 0.1.2
operations:
  current_condition_refresh_interval_update_request:
    action: send
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/current_condition_refresh_interval_update_request'
    description: "\n            A client publishes to this topic in order to request
      that the server updates the property value to provided value.\n\n          \
      \  The server will respond with a message on the response topic indicating whether
      the update was successful, and what the new property value is after the update
      attempt.\n\n            ```plantuml\n            Server -> MQTT Broker: Subscribe
      to {prefix}/weather/{service_id}/property/current_condition_refresh_interval/update\n\
      \            Client -> MQTT Broker: Update Request\n            MQTT Broker
      -> Server:  Update Request\n            Server -> Server: Update property value\n\
      \            Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n            "
    messages:
    - $ref: '#/channels/current_condition_refresh_interval_update_request/messages/current_condition_refresh_interval'
    reply:
      channel:
        $ref: '#/channels/current_condition_refresh_interval_update_response'
    tags:
    - name: property
  current_condition_refresh_interval_update_response:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/current_condition_refresh_interval_update_response'
    description: "\n            A server publishes to this topic in order to provide
      the response to an update request.\n\n            The server will respond with
      a message on the response topic indicating whether the update was successful,
      and what the new property value is after the update attempt.\n\n           \
      \ ```plantuml\n            Server -> MQTT Broker: Subscribe to {prefix}/weather/{service_id}/property/current_condition_refresh_interval/update\n\
      \            Client -> MQTT Broker: Update Request\n            MQTT Broker
      -> Server:  Update Request\n            Server -> Server: Update property value\n\
      \            Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n\n            If the update failed, the most recent property value
      will be included in the response payload, \n            and the client should
      update its local cached property value to match the value in the response, \n\
      \            as that is the current value of the property on the server.\n \
      \           "
    messages:
    - $ref: '#/channels/current_condition_refresh_interval_update_response/messages/current_condition_refresh_interval'
    tags:
    - name: property
  current_condition_refresh_interval_value:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/current_condition_refresh_interval_value'
    description: "\n            Every time the property value changes, the server
      will publish the current property value to MQTT.\n            It publishes with
      a retain=true flag, so that clients can receive the current property value immediately
      upon subscribing.\n            Clients can subscribe to the value topic to receive
      the current property value and be notified of changes to the property value.\n\
