        summary: The current value of the 'current_condition' property.
        tags:
        - name: property
        - name: value
        title: current_condition value
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
      service_id:
        $ref: '#/components/parameters/service_id'
    summary: The current value of the 'current_condition' property.
    tags:
    - name: property
    - name: value
    title: CurrentConditionPropertyValue
  current_temperature_value:
    address: '{prefix}/weather/{service_id}/property/current_temperature/value'
    description: "This is the current (estimated) temperature in degrees fahrenheit.\
      \  This values\nis regularly updated.  The value is extrapolated from the hourly
      forecast, but\nadjusted based on the latest conditions at the nearest weather
      station.\n"
    messages:
