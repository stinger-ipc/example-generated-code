components:
  parameters:
    client_id:
      description: The MQTT Client ID
    prefix:
      description: Topic parameter 'prefix'
    service_id:
      description: The ID of the service/instance
  schemas:
    AllTypes:
      properties:
        OptionalBinary:
          description: An optional binary type. The value should be a 
            base64-encoded string.
          format: byte
          type:
          - string
          - 'null'
        OptionalDateTime:
          description: An optional date and time type.
          format: date-time
          type:
          - string
          - 'null'
        OptionalDuration:
          description: An optional duration type. The value should be an ISO 
            8601 duration string, e.g. 'PT1H30M' for 1 hour and 30 minutes.
          format: duration
          type:
          - string
          - 'null'
        OptionalEnum:
          anyOf:
          - $ref: '#/components/schemas/Numbers'
          - type: 'null'
          description: An optional enum type, one of the numbers.
        OptionalInteger:
          description: An optional integer type.
          type:
          - integer
          - 'null'
        OptionalString:
          description: An optional string type.
          type:
          - string
          - 'null'
        an_entry_object:
          $ref: '#/components/schemas/lunch'
          description: A struct type.
        array_of_binaries:
          description: An array of binary values.
          items:
            description: The value should be a base64-encoded string.
            format: byte
            type: string
          type: array
        array_of_datetimes:
          description: An array of date and time values.
          items:
            format: date-time
            type: string
          type: array
        array_of_durations:
          description: An array of duration values.
          items:
            description: The value should be an ISO 8601 duration string, e.g. 
              'PT1H30M' for 1 hour and 30 minutes.
            format: duration
            type: string
          type: array
        array_of_entry_objects:
          description: An array of struct values.
          items:
            $ref: '#/components/schemas/entry'
          type: array
        array_of_enums:
          description: An array of enums.
          items:
            $ref: '#/components/schemas/Numbers'
          type: array
        array_of_integers:
          description: An array of integers.
          items:
            type: integer
          type: array
        array_of_strings:
          description: An array of strings.
          items:
            type: string
          type: array
        data:
          description: A binary type. The value should be a base64-encoded 
            string.
          format: byte
          type: string
        date_and_time:
          description: A date and time type.
          format: date-time
          type: string
        optionalEntryObject:
          anyOf:
          - $ref: '#/components/schemas/entry'
          - type: 'null'
          description: An optional struct type.
        optional_array_of_binaries:
          description: An optional array of binary values.
          items:
            description: The value should be a base64-encoded string.
            format: byte
            type: string
          type:
          - array
          - 'null'
        optional_array_of_datetimes:
          description: An optional array of date and time values.
          items:
            format: date-time
            type: string
          type:
          - array
          - 'null'
        optional_array_of_durations:
          description: An optional array of duration values.
          items:
            description: The value should be an ISO 8601 duration string, e.g. 
              'PT1H30M' for 1 hour and 30 minutes.
            format: duration
            type: string
          type:
          - array
          - 'null'
        optional_array_of_entry_objects:
          description: An optional array of struct values.
          items:
            $ref: '#/components/schemas/entry'
          type:
          - array
          - 'null'
        optional_array_of_enums:
          description: An optional array of enums.
          items:
            $ref: '#/components/schemas/Numbers'
          type:
          - array
          - 'null'
        optional_array_of_integers:
          description: An optional array of integers.
          items:
            type: integer
          type:
          - array
          - 'null'
        optional_array_of_strings:
          description: An optional array of strings.
          items:
            type: string
          type:
          - array
          - 'null'
        the_bool:
          type: boolean
        the_enum:
          $ref: '#/components/schemas/Numbers'
          description: An enum type
        the_int:
          type: integer
        the_number:
          description: A floating point number.  Bool and int do not have 
            descriptions.
          type: number
        the_str:
          description: A string type.
          type: string
        time_duration:
          description: A duration type. The value should be an ISO 8601 duration
            string, e.g. 'PT1H30M' for 1 hour and 30 minutes.
          format: duration
          type: string
      required:
      - the_bool
      - the_int
      - the_number
      - the_str
      - the_enum
      - an_entry_object
      - date_and_time
      - time_duration
      - data
      - array_of_integers
      - array_of_strings
      - array_of_enums
      - array_of_datetimes
      - array_of_durations
      - array_of_binaries
      - array_of_entry_objects
      type: object
    Numbers:
      description: "JSON Value `1` is `one` - The number one\nJSON Value `2` is `two`
        - \nJSON Value `3` is `three` - Value two has no description."
      enum:
      - 1
      - 2
      - 3
      type: integer
    entry:
      properties:
        key:
          description: An identifier.
          type: integer
        value:
          description: A name.
          type: string
      required:
      - key
      - value
      type: object
    lunch:
      description: Structure representing a lunch order.
      properties:
        crackers:
          description: The number of crackers that come with lunch.
          type: number
        drink:
          description: Whether or not lunch comes with a drink
          type: boolean
        duration_of_lunch:
          description: The amount of time lunch lasts. The value should be an 
            ISO 8601 duration string, e.g. 'PT1H30M' for 1 hour and 30 minutes.
          format: duration
          type: string
        order_number:
          type:
          - integer
          - 'null'
        sandwich:
          description: The type of sandwich which will be served.
          type: string
        time_of_lunch:
          description: The time when lunch is served.
          format: date-time
          type: string
      required:
      - drink
      - sandwich
      - crackers
      - time_of_lunch
      - duration_of_lunch
      type: object
