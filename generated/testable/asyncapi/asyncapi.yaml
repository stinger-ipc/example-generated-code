info:
  description: This tries to capture most variants of features.
  tags:
  - name: signal
  - name: method
  - name: property
  - name: discovery
  title: testable
  version: 0.0.1
operations:
  arrayOfEveryType:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/arrayOfEveryType'
    description: "\n            The server publishes a message to the signal topic
      whenever the signal is emitted.\n            Clients can subscribe to the signal
      topic to receive messages whenever the signal is emitted.\n\n            ```plantuml\n\
      \            Client -> MQTT Broker: Subscribe\n            Server -> MQTT Broker:
      'arrayOfEveryType' Signal\n            MQTT Broker -> Client: 'arrayOfEveryType'
      Signal\n            ```\n\n            The message is not retained, so clients
      will only receive the signal message when the signal is emitted while they are
      subscribed.\n            "
    messages:
    - $ref: '#/channels/arrayOfEveryType/messages/arrayOfEveryType'
    summary: Receive the 'arrayOfEveryType' signal.
    tags:
    - name: signal
  callOneBinary_request:
    action: send
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/callOneBinary_request'
    description: "\n            A method may call one of the server's methods by publishing
      a message to the method's request topic.\n\n            ```plantuml\n      \
      \      Client -> MQTT Broker: Method Request\n            MQTT Broker -> Server:
      Method Request\n            Server -> Server: Process method call\n        \
