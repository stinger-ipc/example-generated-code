asyncapi: 3.0.0
channels:
  addNumbers_request:
    address: '{prefix}/Full/{service_id}/method/addNumbers/request'
    messages:
      addNumbers_request:
        bindings:
          mqtt:
            bindingVersion: 0.2.0
            contentType: application/json
            correlationData:
              format: uuid
              type: string
            responseTopic:
              pattern: client/[^\}]+/Full/method/addNumbers/response
              type: string
        contentType: application/json
        description: "The payload represents the arguments for the method call.  It
          is encoded as a JSON object.\n            \n            Correlation data
          must be provided as an MQTT property.  The data can be any binary data,
          but must be unique to this method.  Typically, using a UUID is sufficient
          to ensure uniqueness.  The server will include the same correlation data
          in the response message, so the client can match responses to requests when
          multiple requests are in-flight.\n            \n            A response topic
          must be provided as an MQTT property.  The server will publish the response
          message to the provided response topic.  The method-calling client must
          have a valid subscription to the MQTT response topic.\n            "
        name: addNumbers_request
        payload:
          properties:
            first:
              type: integer
            second:
              type: integer
            third:
              type:
              - integer
              - 'null'
          required:
          - first
          - second
          type: object
        tags:
        - name: method
        - name: request
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
      service_id:
        $ref: '#/components/parameters/service_id'
  addNumbers_response:
    address: client/{client_id}/Full/method/addNumbers/response
    messages:
      addNumbers_return_values:
        bindings:
          mqtt:
            bindingVersion: 0.2.0
            contentType: application/json
        contentType: application/json
        description: "\n            This payload represents the {% if self.method.return_arg_list
          | length > 1 %}return values{%elif self.method.return_arg_list | length
          == 1 %}return value{% else %}completion{% endif %} of the method call response.\
          \  It is encoded as a JSON object.\n            \n            A \"correlation
          data\" MQTT property will be included in the response message, and will
          match the correlation data provided in the request message, so the client
          can match responses to requests when multiple requests are in-flight.  Whatever
          binary data was provided as correlation data in the request will be provided
          as correlation data in the response.\n            (Hint: any blob of data
          works, so you could include extra tracking information like a timestamp
          if you needed it).\n            "
        name: addNumbers return values
        payload:
          properties:
            sum:
              type: integer
          required:
          - sum
          type: object
        tags:
        - name: method
        - name: response
    parameters:
      client_id:
        $ref: '#/components/parameters/client_id'
