components:
  parameters:
    client_id:
      description: The MQTT Client ID
    prefix:
      description: Topic parameter 'prefix'
    service_id:
      description: The ID of the service/instance
  schemas:
    dayOfTheWeek:
      description: "The days of the week.\nJSON Value `1` is `Sunday` - First day
        of the week.\nJSON Value `2` is `Monday` - \nJSON Value `3` is `Tuesday` -\
        \ \nJSON Value `4` is `Wednesday` - \nJSON Value `5` is `Thursday` - \nJSON
        Value `6` is `Friday` - \nJSON Value `7` is `Saturday` - "
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
    family_name_property:
      properties:
        family_name:
          type: string
      required:
      - family_name
      type: object
    favorite_foods_property:
      properties:
        breakfast:
          type:
          - string
          - 'null'
        drink:
          type: string
        slices_of_pizza:
          type: integer
      required:
      - drink
      - slices_of_pizza
      type: object
    favorite_number_property:
      properties:
        number:
          type: integer
      required:
      - number
      type: object
    last_birthdays_property:
      properties:
        brothers_age:
          description: The age of my brothers in years.
          type:
          - integer
          - 'null'
        dad:
          type: string
        mom:
          type: string
        sister:
          type: string
      required:
      - mom
      - dad
      type: object
    last_breakfast_time_property:
      properties:
        timestamp:
          type: string
      required:
      - timestamp
      type: object
    lunch:
      description: Structure representing a lunch order.
      properties:
        crackers:
          description: The number of crackers that come with lunch.
          type: number
        day:
          $ref: '#/components/schemas/dayOfTheWeek'
        drink:
          description: Whether or not lunch comes with a drink
          type: boolean
        duration_of_lunch:
          description: The amount of time lunch lasts. The value should be an 
            ISO 8601 duration string, e.g. 'PT1H30M' for 1 hour and 30 minutes.
          format: duration
          type: string
        order_number:
          type:
          - integer
          - 'null'
        sandwich:
          description: The type of sandwich which will be served.
          type: string
        time_of_lunch:
          description: The time when lunch is served.
          format: date-time
          type: string
      required:
      - drink
      - sandwich
      - crackers
      - day
      - time_of_lunch
      - duration_of_lunch
      type: object
    lunch_menu_property:
      properties:
        monday:
          $ref: '#/components/schemas/lunch'
        tuesday:
          $ref: '#/components/schemas/lunch'
      required:
      - monday
      - tuesday
      type: object
    multiplesOfTen:
      description: "Enumeration of multiples of ten.\nJSON Value `10` is `Ten` - First
        multiple of ten.\nJSON Value `20` is `Twenty` - Second multiple of ten.\n\
        JSON Value `30` is `Thirty` - \nJSON Value `40` is `Forty` - \nJSON Value
        `50` is `Fifty` - "
      enum:
      - 10
      - 20
      - 30
      - 40
      - 50
      type: integer
info:
  description: Example StingerAPI interface which demonstrates many features.
  tags:
  - name: signal
  - name: method
  - name: property
  - name: discovery
  title: Full
  version: 0.0.2
operations:
  addNumbers_request:
    action: send
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/addNumbers_request'
    description: "\n            A method may call one of the server's methods by publishing
      a message to the method's request topic.\n\n            ```plantuml\n      \
      \      Client -> MQTT Broker: Method Request\n            MQTT Broker -> Server:
      Method Request\n            Server -> Server: Process method call\n        \
      \    Server -> MQTT Broker: Method Response\n            MQTT Broker -> Client:
      Method Response\n            ```\n            "
    messages:
    - $ref: '#/channels/addNumbers_request/messages/addNumbers_request'
    reply:
      channel:
        $ref: '#/channels/addNumbers_response'
    tags:
    - name: method
    - name: request
  addNumbers_response:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/addNumbers_response'
    description: "\n            The server will publish a response message to the
      response topic provided in the request message.  The response message will contain
      the return value(s) of the method call.\n\n            ```plantuml\n       \
      \     Client -> MQTT Broker: Method Request\n            MQTT Broker -> Server:
      Method Request\n            Server -> Server: Process method call\n        \
      \    Server -> MQTT Broker: Method Response\n            MQTT Broker -> Client:
