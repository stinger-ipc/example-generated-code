      $ref: '#/channels/what_time_is_it_request'
    description: "\n            A method may call one of the server's methods by publishing
      a message to the method's request topic.\n\n            ```plantuml\n      \
      \      Client -> MQTT Broker: Method Request\n            MQTT Broker -> Server:
      Method Request\n            Server -> Server: Process method call\n        \
      \    Server -> MQTT Broker: Method Response\n            MQTT Broker -> Client:
      Method Response\n            ```\n            "
    messages:
    - $ref: '#/channels/what_time_is_it_request/messages/what_time_is_it_request'
    reply:
      channel:
        $ref: '#/channels/what_time_is_it_response'
    tags:
    - name: method
    - name: request
  what_time_is_it_response:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/what_time_is_it_response'
    description: "\n            The server will publish a response message to the
      response topic provided in the request message.  The response message will contain
      the return value(s) of the method call.\n\n            ```plantuml\n       \
      \     Client -> MQTT Broker: Method Request\n            MQTT Broker -> Server:
      Method Request\n            Server -> Server: Process method call\n        \
      \    Server -> MQTT Broker: Method Response\n            MQTT Broker -> Client:
