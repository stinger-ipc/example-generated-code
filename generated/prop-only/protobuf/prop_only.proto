syntax = "proto3";

package prop_only;




// Advertisement/discovery information published periodically for the interface.
message InterfaceInfo {
    string interface_name = 1;
    string title = 2;
    string version = 3;
    string instance = 4;
    string connection_topic = 5;
    string timestamp = 6;  // ISO 8601 format
    map<string, string> methods = 7;  // Maps method names to their version string, for methods that declare a version.
}


enum Country {
    COUNTRY_UNSPECIFIED = 0; 
    COUNTRY_USA = 1;
    COUNTRY_CANADA = 2;
    COUNTRY_MEXICO = 3;
}


message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string postal_code = 4;
    Country country = 5;
}





message HomeAddressProperty {
    Address address = 1;
}

message FavoriteCountryProperty {
    Country country = 1;
}


