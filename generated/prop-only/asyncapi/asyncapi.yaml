  interface_info:
    address: '{prefix}/prop-only/{service_id}/interface'
    description: Advertisement/discovery channel for the 'prop-only' interface.
    messages:
      interface_info:
        bindings:
          mqtt:
            bindingVersion: 0.2.0
            contentType: application/json
        contentType: application/json
        description: The server periodically publishes this message (with a 
          message-expiry interval) so that clients can discover running 
          instances of the interface and the versions of the methods they 
          support.
        name: InterfaceInfo
        payload:
          properties:
            connection_topic:
              type: string
            instance:
              type: string
            interface_name:
              type: string
            methods:
              additionalProperties:
                type: string
              description: Maps method names to their version string, for 
                methods that declare a version.
              type: object
            prefix:
              type: string
            timestamp:
              format: date-time
              type: string
            title:
              type: string
            version:
              type: string
          required:
          - interface_name
          - title
          - version
          - instance
          - connection_topic
          - timestamp
          - prefix
          type: object
        summary: Advertisement/discovery information for the 'prop-only' 
          interface.
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
      service_id:
        $ref: '#/components/parameters/service_id'
components:
  parameters:
    client_id:
      description: The MQTT Client ID
    prefix:
      description: Topic parameter 'prefix'
    service_id:
      description: The ID of the service/instance
  schemas:
    address:
      description: Structure representing a mailing address.
      properties:
        city:
          description: The city name.
          type: string
        country:
          $ref: '#/components/schemas/country'
        postal_code:
          description: The postal or ZIP code.
          type: string
        state:
          description: The state or province.
          type: string
        street:
          description: The street address.
          type: string
      required:
      - street
      - city
      - state
      - postal_code
      - country
      type: object
    country:
      description: "A small set of supported countries.\nJSON Value `1` is `USA` -
        United States of America.\nJSON Value `2` is `Canada` - \nJSON Value `3` is
        `Mexico` - "
      enum:
      - 1
      - 2
      - 3
      type: integer
    favorite_country_property:
      properties:
        country:
          $ref: '#/components/schemas/country'
      required:
      - country
      type: object
    home_address_property:
      properties:
        address:
          $ref: '#/components/schemas/address'
      required:
      - address
      type: object
info:
  description: Example StingerAPI interface which only has properties, plus a 
    struct and an enum.
  tags:
  - name: signal
  - name: method
  - name: property
  - name: discovery
  title: prop-only
  version: 0.0.1
operations:
  favorite_country_update_request:
    action: send
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/favorite_country_update_request'
    description: "\n            A client publishes to this topic in order to request
      that the server updates the property value to provided value.\n\n          \
      \  The server will respond with a message on the response topic indicating whether
      the update was successful, and what the new property value is after the update
      attempt.\n\n            ```plantuml\n            Server -> MQTT Broker: Subscribe
      to {prefix}/prop-only/{service_id}/property/favorite_country/update\n      \
      \      Client -> MQTT Broker: Update Request\n            MQTT Broker -> Server:\
      \  Update Request\n            Server -> Server: Update property value\n   \
      \         Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n            "
    messages:
    - $ref: '#/channels/favorite_country_update_request/messages/favorite_country'
    reply:
      channel:
        $ref: '#/channels/favorite_country_update_response'
    tags:
    - name: property
  favorite_country_update_response:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/favorite_country_update_response'
    description: "\n            A server publishes to this topic in order to provide
      the response to an update request.\n\n            The server will respond with
      a message on the response topic indicating whether the update was successful,
      and what the new property value is after the update attempt.\n\n           \
      \ ```plantuml\n            Server -> MQTT Broker: Subscribe to {prefix}/prop-only/{service_id}/property/favorite_country/update\n\
      \            Client -> MQTT Broker: Update Request\n            MQTT Broker
      -> Server:  Update Request\n            Server -> Server: Update property value\n\
      \            Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n\n            If the update failed, the most recent property value
      will be included in the response payload, \n            and the client should
      update its local cached property value to match the value in the response, \n\
      \            as that is the current value of the property on the server.\n \
      \           "
    messages:
    - $ref: '#/channels/favorite_country_update_response/messages/favorite_country'
    tags:
    - name: property
  favorite_country_value:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/favorite_country_value'
    description: "\n            Every time the property value changes, the server
      will publish the current property value to MQTT.\n            It publishes with
      a retain=true flag, so that clients can receive the current property value immediately
      upon subscribing.\n            Clients can subscribe to the value topic to receive
      the current property value and be notified of changes to the property value.\n\
      \n            ```plantuml\n            Server -> MQTT Broker: 'favorite_country'
      Value (retain=true)\n            Client -> MQTT Broker: Subscribe\n        \
      \    MQTT Broker -> Client: 'favorite_country' Value\n            ```\n    \
      \        "
    messages:
    - $ref: '#/channels/favorite_country_value/messages/favorite_country'
    summary: Receive the current value of the 'favorite_country' property.
    tags:
    - name: property
    - name: value
    title: ReceiveFavoriteCountryPropertyValue
  home_address_update_request:
    action: send
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/home_address_update_request'
    description: "\n            A client publishes to this topic in order to request
      that the server updates the property value to provided value.\n\n          \
      \  The server will respond with a message on the response topic indicating whether
      the update was successful, and what the new property value is after the update
      attempt.\n\n            ```plantuml\n            Server -> MQTT Broker: Subscribe
      to {prefix}/prop-only/{service_id}/property/home_address/update\n          \
      \  Client -> MQTT Broker: Update Request\n            MQTT Broker -> Server:\
      \  Update Request\n            Server -> Server: Update property value\n   \
      \         Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n            "
    messages:
    - $ref: '#/channels/home_address_update_request/messages/home_address'
    reply:
      channel:
        $ref: '#/channels/home_address_update_response'
    tags:
    - name: property
  home_address_update_response:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/home_address_update_response'
    description: "\n            A server publishes to this topic in order to provide
      the response to an update request.\n\n            The server will respond with
      a message on the response topic indicating whether the update was successful,
      and what the new property value is after the update attempt.\n\n           \
      \ ```plantuml\n            Server -> MQTT Broker: Subscribe to {prefix}/prop-only/{service_id}/property/home_address/update\n\
      \            Client -> MQTT Broker: Update Request\n            MQTT Broker
      -> Server:  Update Request\n            Server -> Server: Update property value\n\
      \            Server -> MQTT Broker: New Property Value\n            MQTT Broker
      -> Client: New Property Value\n            Server -> MQTT Broker: Property Update
      Response\n            MQTT Broker -> Client: Property Update Response\n    \
      \        ```\n\n            If the update failed, the most recent property value
      will be included in the response payload, \n            and the client should
      update its local cached property value to match the value in the response, \n\
      \            as that is the current value of the property on the server.\n \
      \           "
    messages:
    - $ref: '#/channels/home_address_update_response/messages/home_address'
    tags:
    - name: property
  home_address_value:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 2
        retain: false
    channel:
      $ref: '#/channels/home_address_value'
    description: "\n            Every time the property value changes, the server
      will publish the current property value to MQTT.\n            It publishes with
      a retain=true flag, so that clients can receive the current property value immediately
      upon subscribing.\n            Clients can subscribe to the value topic to receive
      the current property value and be notified of changes to the property value.\n\
      \n            ```plantuml\n            Server -> MQTT Broker: 'home_address'
      Value (retain=true)\n            Client -> MQTT Broker: Subscribe\n        \
      \    MQTT Broker -> Client: 'home_address' Value\n            ```\n        \
      \    "
    messages:
    - $ref: '#/channels/home_address_value/messages/home_address'
    summary: Receive the current value of the 'home_address' property.
    tags:
    - name: property
    - name: value
    title: ReceiveHomeAddressPropertyValue
  interface_info:
    action: receive
    bindings:
      mqtt:
        bindingVersion: 0.2.0
        qos: 1
        retain: false
    channel:
      $ref: '#/channels/interface_info'
    description: "\n            The server publishes this message periodically (with
      a message-expiry interval) so that clients can discover running server instances
      and the method versions they advertise.\n\n            ```plantuml\n       \
      \     Server -> MQTT Broker: Interface Info (with message expiry)\n        \
      \    Client -> MQTT Broker: Subscribe\n            MQTT Broker -> Client: Interface
      Info\n            ```\n            "
    messages:
    - $ref: '#/channels/interface_info/messages/interface_info'
    summary: Receive 'prop-only' interface advertisement/discovery information.
    tags:
    - name: discovery
