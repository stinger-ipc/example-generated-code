syntax = "proto3";

package simple;




// Advertisement/discovery information published periodically for the interface.
message InterfaceInfo {
    string interface_name = 1;
    string title = 2;
    string version = 3;
    string instance = 4;
    string connection_topic = 5;
    string timestamp = 6;  // ISO 8601 format
    map<string, string> methods = 7;  // Maps method names to their version string, for methods that declare a version.
}


enum Gender {
    GENDER_UNSPECIFIED = 0; 
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
    GENDER_OTHER = 3;
}


message Person {
    string name = 1;
    Gender gender = 2;
}



message PersonEnteredSignal {
    Person person = 1;
}



message SchoolProperty {
    string name = 1;
}



message TradeNumbersRequest {
    int32 your_number = 1;
}

message TradeNumbersResponse {
    int32 my_number = 1;
}
